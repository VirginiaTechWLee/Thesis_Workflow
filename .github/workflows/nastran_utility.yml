name: Nastran Utility - FEM Validation & Diagnostics

on:
  workflow_dispatch:
    inputs:
      analysis_type:
        description: 'Analysis type'
        required: true
        default: 'full'
        type: choice
        options:
          - sol103
          - sol111
          - full

  push:
    paths:
      - 'fem_input/*.dat'
      - 'fem_input/*.blk'

  repository_dispatch:
    types: [nastran_validation]

jobs:
  nastran-utility:
    runs-on: self-hosted
    timeout-minutes: 60

    steps:
      # ================================================================
      # STAGE 1: CHECKOUT
      # ================================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # ================================================================
      # STAGE 2: DETERMINE ANALYSIS TYPE
      # ================================================================
      - name: Set analysis type
        id: params
        shell: powershell
        run: |
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          Log "========================================================"
          Log "  NASTRAN UTILITY - SETTING PARAMETERS"
          Log "========================================================"

          # Priority: workflow_dispatch input > repository_dispatch payload > config default
          $analysisType = "${{ github.event.inputs.analysis_type }}"
          if (-not $analysisType) {
            $analysisType = "${{ github.event.client_payload.analysis_type }}"
          }
          if (-not $analysisType) {
            $analysisType = "full"
          }

          Log "Analysis type: $analysisType"
          echo "ANALYSIS_TYPE=$analysisType" >> $env:GITHUB_OUTPUT
          Log "========================================================"

      # ================================================================
      # STAGE 3: VALIDATE FEM INPUTS (with DBALL readiness checks)
      # ================================================================
      - name: Validate FEM inputs
        shell: powershell
        run: |
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          Log "========================================================"
          Log "  VALIDATING FEM INPUTS (DBALL READINESS)"
          Log "========================================================"

          & "${{ vars.PYTHON_PATH }}" pipeline/validate_fem_inputs.py --dball
          if ($LASTEXITCODE -ne 0) {
            Log "ERROR: FEM input validation failed"
            exit 1
          }
          Log "========================================================"

      # ================================================================
      # STAGE 4: RUN NASTRAN UTILITY
      # ================================================================
      - name: Run Nastran Utility
        id: nastran
        shell: powershell
        run: |
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          $analysisType = "${{ steps.params.outputs.ANALYSIS_TYPE }}"

          Log "========================================================"
          Log "  RUNNING NASTRAN UTILITY ($analysisType)"
          Log "========================================================"

          & "${{ vars.PYTHON_PATH }}" pipeline/run_nastran_utility.py --type $analysisType
          if ($LASTEXITCODE -ne 0) {
            Log "ERROR: Nastran utility run failed"
            exit 1
          }
          Log "========================================================"

      # ================================================================
      # STAGE 5: FEM SCREENSHOTS (auto-detect Femap/Patran)
      # ================================================================
      - name: Install report dependencies
        shell: powershell
        run: |
          & "${{ vars.PYTHON_PATH }}" -m pip install anthropic python-docx Pillow pywin32 --quiet 2>&1 | Out-Null
          & "${{ vars.PYTHON_PATH }}" -c "import anthropic; print(f'anthropic {anthropic.__version__}')"
          & "${{ vars.PYTHON_PATH }}" -c "import docx; print(f'python-docx installed')"

      - name: Capture FEM screenshots
        id: screenshots
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          $runFolder = "${{ steps.nastran.outputs.RUN_FOLDER }}"

          Log "========================================================"
          Log "  CAPTURING FEM SCREENSHOTS"
          Log "========================================================"
          Log "Run folder: $runFolder"

          if (-not $runFolder -or -not (Test-Path $runFolder)) {
            Log "WARNING: Run folder not found, skipping screenshots"
            echo "HAS_IMAGES=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          & "${{ vars.PYTHON_PATH }}" pipeline/fem_screenshots.py --run-folder "$runFolder"
          $exitCode = $LASTEXITCODE

          if ($exitCode -ne 0) {
            Log "WARNING: Screenshot capture failed (non-fatal, will generate text-only report)"
            echo "HAS_IMAGES=false" >> $env:GITHUB_OUTPUT
          }
          Log "========================================================"

      # ================================================================
      # STAGE 6: GENERATE SIMULATION REPORT (DOCX if images, else MD)
      # ================================================================
      - name: Generate simulation report
        shell: powershell
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          $ErrorActionPreference = "Continue"
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          $runFolder = "${{ steps.nastran.outputs.RUN_FOLDER }}"
          $stderrFile = "$runFolder\report_stderr.log"

          Log "========================================================"
          Log "  GENERATING SIMULATION REPORT"
          Log "========================================================"
          Log "Run folder: $runFolder"

          if (-not $runFolder -or -not (Test-Path $runFolder)) {
            Log "ERROR: Run folder not found: $runFolder"
            exit 1
          }

          & "${{ vars.PYTHON_PATH }}" pipeline/generate_simulation_report.py --run-folder "$runFolder" 2>$stderrFile
          $exitCode = $LASTEXITCODE

          if (Test-Path $stderrFile) {
            $stderr = Get-Content $stderrFile -Raw
            if ($stderr -and $stderr.Trim()) {
              Log "Python stderr:"
              Get-Content $stderrFile | ForEach-Object { Log "  $_" }
            }
          }

          if ($exitCode -ne 0) {
            Log "WARNING: Simulation report generation failed (non-fatal)"
          }

          # Display report if generated (always display .md backup for CI log)
          $reportMd = "$runFolder\simulation_report.md"
          $reportDocx = "$runFolder\simulation_report.docx"
          if (Test-Path $reportDocx) {
            Log "DOCX report generated: $reportDocx"
          }
          if (Test-Path $reportMd) {
            Log ""
            Log "=== SIMULATION REPORT ==="
            Get-Content $reportMd -Encoding utf8
            Log "========================="
          }
          Log "========================================================"

      # ================================================================
      # STAGE 6: CLEANUP & SUMMARY
      # ================================================================
      - name: Cleanup Nastran and Patran processes
        if: always()
        shell: powershell
        run: |
          Stop-Process -Name "nastran" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "nastranw" -Force -ErrorAction SilentlyContinue
          Stop-Process -Name "patran" -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2

      - name: Summary
        if: always()
        shell: powershell
        run: |
          function Log { param([string]$Message) Write-Host "[$(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')] $Message" }

          $runFolder = "${{ steps.nastran.outputs.RUN_FOLDER }}"

          Log "========================================================"
          Log "  NASTRAN UTILITY - SUMMARY"
          Log "========================================================"
          Log "Analysis type: ${{ steps.params.outputs.ANALYSIS_TYPE }}"
          Log "Run folder: $runFolder"

          if ($runFolder -and (Test-Path $runFolder)) {
            Log ""
            Log "Output files:"
            Get-ChildItem $runFolder -File | ForEach-Object {
              Log "  $($_.Name) ($($_.Length) bytes)"
            }

            $reportMd = Test-Path "$runFolder\simulation_report.md"
            $reportDocx = Test-Path "$runFolder\simulation_report.docx"
            $imageCount = (Get-ChildItem "$runFolder\*.png" -ErrorAction SilentlyContinue | Measure-Object).Count
            Log ""
            Log "Simulation report (MD): $(if ($reportMd) { 'YES' } else { 'NO' })"
            Log "Simulation report (DOCX): $(if ($reportDocx) { 'YES' } else { 'NO' })"
            Log "FEM screenshots: $imageCount"
          }
          Log "========================================================"
